[workspace]

members = [
    "keyberon-smart-keyboard",
    "rp2040-rtic-smart-keyboard",
    "smart-keymap-core",
    "smart-keymap-full-system-std",
    "smart-keymap-macros",
    "smart-keymap-nickel-helper",
    "smart_keymap",
    "stm32-embassy-smart-keyboard",
    "stm32f4-rtic-smart-keyboard",
]

[workspace.package]
version = "0.17.0-dev"
authors = ["Richard Goulter <richard.goulter@gmail.com>"]
edition = "2021"
license = "MIT OR Apache-2.0"

[package]
name = "smart-keymap"
version.workspace = true
license.workspace = true
edition.workspace = true
authors.workspace = true

[features]
default = ["std"]
std = ["smart-keymap-core/std", "serde/std", "dep:serde_json"]

[lib]
name = "smart_keymap"
crate-type = ["lib"]

[[test]]
name = "rust-integration"
path = "tests/rust/keymap.rs"

[dependencies]
# Facade re-exports core modules; serde needed for dummy `init` derives.
serde = { version = "1.0", features = ["derive"], default-features = false }
serde_json = { version = "1.0", optional = true }
smart-keymap-core = { path = "./smart-keymap-core", default-features = false }

[dev-dependencies]
ron = "0.8"

smart-keymap-macros = { path = "./smart-keymap-macros" }
smart-keymap-nickel-helper = { path = "./smart-keymap-nickel-helper" }

[build-dependencies]
smart-keymap-nickel-helper = { path = "./smart-keymap-nickel-helper" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
